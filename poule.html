<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv='cache-control' content='no-cache'>
    <meta http-equiv='expires' content='0'>
    <meta http-equiv='pragma' content='no-cache'>

    <title>Overzicht reeks</title>

    <script src="libs/dexie.js"></script>
    <script src="libs/plotly-2.9.0.min.js"></script>
    
    <script src="fetching.js?v=3"></script>
    <script src="vis.js?v=3"></script>
    <script src="common.js?v=3"></script>

    <style type="text/css">
        body {
        }
        g.textpoint text {
            stroke: black;
            font-weight: bold;
        }
        body.loading #js {
            display: none;
        }
        body > #loading_msg {
            display: none;
        }
        body.loading > #loading_msg {
            display: initial;
        }
        .figure {
            height: 98vmin;
            width: 98vmin;
        }
        #stand {
            margin: 12px auto;
        }
    </style>
</head>
<body>
    <h1 id="js">Javascript staat uit!</h1>
    <h1 id="loading_msg">Laden...</h1>
    <p>
        <a id="poule_teams_link">Teams in deze reeks</a>
        &horbar;
        <a id="poule_players_link">Spelers in deze reeks</a>
    </p>
    <table id="stand"></table>

    <h2>Stand over tijd</h2>
    <div class="figure" id="wl_plot"></div>
    <div class="figure" id="percentage_plot" style="display: none"></div>
    <div class="figure" id="games_above_500_plot"></div>
    <div class="figure" id="all_games_plot"></div>

    <script type="text/javascript">
        function make_standings_plots(games) {
            const teams = new Map();
            games.forEach(game => {
                teams.set(game.tTGUID, game.tTNaam);
                teams.set(game.tUGUID, game.tUNaam);
            });

            const team_data = [...teams].map(([guid, name]) => {
                const played_games = games
                    .filter(game => game.uitslag && (game.tTGUID === guid || game.tUGUID === guid))
                    .sort((a, b) => a.jsDTCode - b.jsDTCode);
                const wins = played_games.map(game => {
                    const home_won = Number(game.uitslag.slice(0, 3)) > Number(game.uitslag.slice(4, 7));
                    return home_won === (game.tTGUID === guid);
                });
                return {guid, name, played_games, wins};
            });
            const standings = team_data.map(team => ({
                team,
                wins: team.wins.filter(Boolean).length,
                losses: team.wins.filter(won => !won).length,
            })).sort((a, b) => b.wins - a.wins || a.losses - b.losses);
            document.getElementById('stand').innerHTML = [
                '<thead><tr><th>Team</th><th>W</th><th>L</th><th>%</th><th>+/-</th></tr></thead><tbody>',
                ...standings.map(({team, wins, losses}) => {
                    return `<tr><td><a href="team.html?team=${encodeURIComponent(team.guid)}">${shorten_teamname(team.name)}</a></td><td>${wins}</td><td>${losses}</td><td>${wins + losses ? (wins / (wins + losses)).toFixed(3) : '-'}</td><td>${wins - losses}</td></tr>`;
                }),
                '</tbody>',
            ].join('');

            const team_trace = (team, values) => ({
                x: values.x,
                y: values.y,
                type: 'scatter',
                mode: 'lines+markers',
                marker: {symbol: 'circle', color: window.team_guid_to_colour[team.guid]},
                line: {shape: 'spline', color: window.team_guid_to_colour[team.guid]},
                name: shorten_teamname(team.name),
                text: values.text,
                hoverinfo: 'text',
            });
            const date_trace = (team, selector) => {
                let wins = 0;
                let losses = 0;
                const points = team.played_games.map((game, i) => {
                    if (team.wins[i]) wins += 1;
                    else losses += 1;
                    return {
                        x: new Date(game.jsDTCode).toISOString(),
                        y: selector(wins, losses),
                        text: `${shorten_teamname(team.name)} ${wins}-${losses} after ${game.datumString}`,
                    };
                });
                return team_trace(team, {
                    x: points.map(point => point.x),
                    y: points.map(point => point.y),
                    text: points.map(point => point.text),
                });
            };

            const wins_losses = team_data.map(team => {
                let wins = 0;
                let losses = 0;
                const x = [0];
                const y = [0];
                team.wins.forEach(won => {
                    if (won) wins += 1;
                    else losses += 1;
                    x.push(losses);
                    y.push(wins);
                });
                return team_trace(team, {
                    x, y,
                    text: x.map((_, i) => `${shorten_teamname(team.name)} ${y[i]}-${x[i]}`),
                });
            });
            Plotly.newPlot('wl_plot', wins_losses, {
                title: 'Wins and losses',
                xaxis: {title: 'Losses'},
                yaxis: {title: 'Wins'},
                showlegend: true,
            }, {scrollZoom: true});

            const percentage_traces = team_data.map(team => date_trace(
                team, (wins, losses) => wins / (wins + losses)
            ));
            Plotly.newPlot('percentage_plot', percentage_traces, {
                title: 'Winning percentage through time',
                xaxis: {title: 'Time'},
                yaxis: {title: 'Winning percentage', range: [0, 1]},
                showlegend: true,
            }, {scrollZoom: true});

            const games_above_500 = team_data.map(team => date_trace(
                team, (wins, losses) => wins - losses
            ));
            Plotly.newPlot('games_above_500_plot', games_above_500, {
                title: 'Games above .500 through time',
                xaxis: {title: 'Time'},
                yaxis: {title: 'Games above .500'},
                showlegend: true,
            }, {scrollZoom: true});

            const game_scores = games.filter(game => game.uitslag).map(game => ({
                x: Number(game.uitslag.slice(0, 3)),
                y: Number(game.uitslag.slice(4, 7)),
                text: `${shorten_teamname(game.tTNaam)} ${game.uitslag.slice(0, 3)}-${game.uitslag.slice(4, 7)} ${shorten_teamname(game.tUNaam)}`,
            }));
            Plotly.newPlot('all_games_plot', [{
                x: game_scores.map(game => game.x),
                y: game_scores.map(game => game.y),
                text: game_scores.map(game => game.text),
                type: 'scatter',
                mode: 'markers',
                marker: {color: 'black', symbol: 'circle'},
                hoverinfo: 'text',
            }], {
                title: 'All games',
                xaxis: {title: 'Home score'},
                yaxis: {title: 'Away score'},
                showlegend: false,
            }, {scrollZoom: true});
        }

        addEventListener('load', async () => {
            const poule_guid = (new URLSearchParams(window.location.search)).get('pouleGUID');
            document.body.classList.add('loading');
            document.getElementById('poule_teams_link').href = `poule_teams.html?pouleGUID=${encodeURIComponent(poule_guid)}`;
            document.getElementById('poule_players_link').href = `players.html?pouleGUID=${encodeURIComponent(poule_guid)}`;

            all_games = fetch_poule_games(poule_guid);

            all_games = await all_games;
            g = all_games[0];

            // team_guid_to_colours = fetch_team_colours_from_games(all_games);
            const all_team_guids = [...new Set(all_games.flatMap(g => [g.tTGUID, g.tUGUID]))];
            n_teams = all_team_guids.length;

            team_guid_to_colour = Object.fromEntries(all_team_guids.map((g, i) => [g, 
                `hsl(${i * 360 / n_teams}, ${i % 2 ? 0.4 : 0.8}, .4)`,
                // `${i}`
            ]))

            document.querySelector('h1').innerText = all_games[0]['pouleNaam'];

            make_standings_plots(all_games);

            document.body.classList.remove('loading');
        });

    </script>
</body>
</html>
